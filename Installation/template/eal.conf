# DPDK EAL arguments for this project, read by ./run (and Ctrl+Shift+B) and F5.
# One or more args per line; '#' starts a comment.

# Cores: lcore 0 = main, 1 = worker
-l 0-1

# Memory (MB of hugepages). The system pool is vm.nr_hugepages in
# /etc/sysctl.d/80-hugepages.conf; these must fit inside it.
#   --socket-mem   preallocated at startup (one value per NUMA node)
#   --socket-limit hard cap; DPDK grows on demand up to this
--socket-mem=__SOCKET_MEM__
--socket-limit=__SOCKET_LIMIT__

# No files in /dev/hugepages (required when running without sudo)
--in-memory

# Mellanox (mlx5) ports, detected by new-project.sh
__PORTS__

# Arguments for the program itself go after a "--" line (used by ./run and F5):
# --
# --file /path/to/input
